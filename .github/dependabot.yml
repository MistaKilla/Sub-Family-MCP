version: 2

updates:
  # Keep workflow action versions current. setup-uv is pinned to an exact
  # version because astral-sh/setup-uv does not publish a floating v10 tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  # The uv ecosystem updates the lockfile. This repository must commit
  # uv.lock for Dependabot to resolve and update Python dependencies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-runtime:
        dependency-type: "production"
        patterns: ["*"]
      python-development:
        dependency-type: "development"
        patterns: ["*"]
