[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sub-family-mcp"
dynamic = ["version"]
description = "Turn multiple LLMs into a delegation family for Claude Code: sessions, parallel swarms, vision and privacy tiers over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MistaKilla", email = "barmatolog@yandex.ru" }]
keywords = ["mcp", "llm", "claude-code", "subagents", "router", "ollama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.16,<1",
    "rich>=13.9,<16",
    "textual>=8.0,<9",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0,<8",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<3",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0,<5",
]

[project.scripts]
sub-family = "sub_family.cli:app"
sub-family-mcp = "sub_family.cli:serve_entry"

[project.urls]
Homepage = "https://github.com/MistaKilla/Sub-Family-MCP"
Documentation = "https://github.com/MistaKilla/Sub-Family-MCP#readme"
Issues = "https://github.com/MistaKilla/Sub-Family-MCP/issues"
Repository = "https://github.com/MistaKilla/Sub-Family-MCP"
Changelog = "https://github.com/MistaKilla/Sub-Family-MCP/blob/develop/CHANGELOG.md"

[tool.hatch.version]
path = "src/sub_family/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sub_family"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/README.ru.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/server.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PT", "ASYNC", "RUF"]
ignore = [
    "B008",    # Typer/argparse-style dependency injection in defaults
    "ASYNC109",  # httpx accepts a timeout argument; wrapping every call in asyncio.timeout is worse
    "RUF001",  # ambiguous unicode chars in prose/docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT012"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["src/sub_family/tui"]

[[tool.mypy.overrides]]
module = ["yaml", "dotenv"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: spawns the real stdio server and a mock HTTP model"]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:mcp.*",
]

[tool.coverage.run]
source = ["sub_family"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
